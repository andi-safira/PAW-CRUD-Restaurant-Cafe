<!DOCTYPE html>
<head>
    <title>Tambah Menu</title>
</head>
<body>

    <h1>Form Tambah Menu Baru</h1>

    <form action="index.html">
        <label>Nama Menu:</label><br>
        <input type="text" name="nama" required><br><br>

        <label>Kategori:</label><br>
        <select name="kategori">
            <option>Makanan</option>
            <option>Minuman</option>
            <option>Dessert</option>
        </select><br><br>

        <label>Harga (Rp):</label><br>
        <input type="number" name="harga" required><br><br>

        <label>Alergen (Opsional):</label><br>
        <input type="text" name="alergen"><br><br>

        <label>Status Halal:</label><br>
        <input type="radio" name="halal" value="1" checked> Ya
        <input type="radio" name="halal" value="0"> Tidak<br><br>

        <label>Deskripsi:</label><br>
        <textarea name="deskripsi"></textarea><br><br>

        <label>Foto Menu:</label><br>
        <input type="file" name="foto"><br><br>

        <!-- Tombol Simpan & Batal -->
        <button type="submit">Simpan</button>
        <a href="index.html">Batal</a>
    </form>

</body>
